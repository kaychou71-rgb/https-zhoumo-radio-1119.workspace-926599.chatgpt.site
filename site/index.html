<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每週輪替的音樂歌單，透過 YouTube 免費聆聽。">
  <meta name="color-scheme" content="dark">
  <title>週末頻道 — 每週音樂選集</title>
  <link rel="stylesheet" href="./radio.css">
  <script src="./radio.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">♫</span>週末頻道</a>
      <div class="schedule"><i aria-hidden="true"></i>每週一 09:00 更新<span class="zone">・台灣時間</span></div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="heading">
      <div>
        <p class="eyebrow">WEEKLY RADIO</p>
        <h1 id="heading">本週好聲音</h1>
        <p class="subtitle" id="theme">每週音樂選集</p>
        <button type="button" id="start" class="primary"><span aria-hidden="true">▶</span> 播放本週歌單</button>
      </div>
    </section>
    <section id="player" class="player" aria-labelledby="player-title" hidden>
      <div class="player-top">
        <div><p class="eyebrow">正在播放</p><h2 id="player-title" tabindex="-1"></h2><p class="muted" id="player-artist"></p></div>
        <button type="button" id="close-player" class="control" aria-label="關閉播放器">✕</button>
      </div>
      <div class="video" id="video"></div>
      <div class="player-controls">
        <button type="button" class="control" id="previous">上一首</button>
        <button type="button" class="control" id="next">下一首</button>
        <a id="youtube" target="_blank" rel="noopener">在 YouTube 觀看</a>
      </div>
    </section>
    <section class="playlist" aria-labelledby="list-title">
      <div class="list-top">
        <div>
          <h2 id="list-title">歌單</h2>
          <p class="muted" id="date"></p>
        </div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋歌曲或歌手" aria-label="搜尋歌曲或歌手"></label>
      </div>
      <div class="playlist-views" role="group" aria-label="歌單範圍">
        <button type="button" id="show-week" class="control" aria-pressed="true">本週歌單</button>
        <button type="button" id="show-all" class="control" aria-pressed="false">全部精選</button>
      </div>
      <p id="empty" class="muted empty" role="status" hidden>找不到符合的歌曲。</p>
      <ol id="tracks"></ol>
      <noscript>開啟 JavaScript 後即可載入歌單。</noscript>
    </section>
  </main>
  <footer class="wrap footer">音樂影片由 YouTube 提供。播放時可能顯示 YouTube 廣告。</footer>
</body>
</html>
